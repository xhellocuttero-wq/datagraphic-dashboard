<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA GRAPHIC | WARROOM Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fb923c; /* Soft Orange */
            --secondary: #38bdf8; /* Soft Blue */
            --bg-main: #fdfcfb; /* Very Light Warm Grey */
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-sub: #94a3b8;
        }
        body { 
            font-family: 'Inter', 'Sarabun', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main);
            transition: all 0.3s ease;
        }
        .soft-shadow {
            box-shadow: 0 10px 25px -5px rgba(251, 146, 60, 0.05), 0 8px 10px -6px rgba(56, 189, 248, 0.03);
        }
        .card { 
            background: var(--card-bg); 
            border: 1px solid #f8fafc;
            border-radius: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .nav-active {
            color: var(--primary);
            background: #fff7ed;
            font-weight: 600;
            box-shadow: inset 4px 0 0 var(--primary);
        }
        .filter-btn {
            font-size: 11px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 10px;
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .filter-btn.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(251, 146, 60, 0.3);
        }
        .input-clean {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .input-clean:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.1); }
        
        th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); padding: 14px 24px; border-bottom: 2px solid #fff7ed; }
        td { padding: 12px 24px; font-size: 14px; border-bottom: 1px solid #fdfcfb; }
        tr:hover { background: #fffbf7; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #fed7aa; border-radius: 10px; }

        /* Live Feedback Animations */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* View Slide-In Animation */
        @keyframes viewEntrance {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .view-animate {
            animation: viewEntrance 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

    <!-- Main Content -->
    <main id="main-content-area" class="flex-1 flex flex-col p-8 overflow-y-auto">
        
        <!-- Top Bar -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">

    <script type="module">

        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // *** สำคัญมาก: นำค่าจาก Firebase Console ของคุณมาวางตรงนี้ ***
        const firebaseConfig = {
  apiKey: "AIzaSyA0QWdvnA4ubJ42OAHxnDDJQUHkIFasu3w",
  authDomain: "data-5c343.firebaseapp.com",
  projectId: "data-5c343",
  storageBucket: "data-5c343.firebasestorage.app",
  messagingSenderId: "555799172632",
  appId: "1:555799172632:web:ced0d5f789362a9228156d",
  measurementId: "G-S132TKE0NB"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let rawData = { orders: [], fix: [], redo: [], problems: [] };
        let currentView = 'overview';
        let currentTimeFilter = 'daily'; 
        let currentPage = 1;
        const itemsPerPage = 60;
        let charts = {};
        let editingDocId = null;

        const CONFIG = {
            overview: { title: "สรุปผลการทำงาน", desc: "ภาพรวมข้อมูลการผลิตและประสิทธิภาพรายแผนก" },
            orders: { 
                title: "บันทึกงานผลิต", desc: "จัดการรายการผลิตประจำวัน",
                cols: ['วันที่', 'เวลา', 'เลขที่งาน', 'จำนวน', 'แผนก', 'สีงาน', 'สถานะ'],
                fields: [
                    { name: 'date', label: 'วันที่', type: 'date' },
                    { name: 'time', label: 'เวลา', type: 'time' },
                    { name: 'id', label: 'เลขที่งาน', type: 'number' },
                    { name: 'count', label: 'จำนวน', type: 'number' },
                    { name: 'dept', label: 'แผนก', type: 'select', options: ['งานเรียง', 'งานล็อต', 'งานBY', 'งานเฉินผิง', 'งานด่วน'] },
                    { name: 'color', label: 'สีงาน', type: 'select', options: ['สีแดง', 'สีเหลือง', 'สีชมพู', 'สีเขียว', 'สีส้ม', 'สีฟ้า', 'สีม่วง', 'สีขาว'] }
                ]
            },
            fix: { 
                title: "รายการงานแก้", desc: "ติดตามรายการที่ต้องแก้ไข",
                cols: ['วันที่และเวลา', 'รูปที่', 'ประเภท', 'รหัส SKU', 'รหัสออเดอร์', 'สถานะ'],
                fields: [
                    { name: 'date', label: 'วันที่', type: 'date' },
                    { name: 'time', label: 'เวลา', type: 'time' },
                    { name: 'type', label: 'ประเภทงานแก้', type: 'select', options: ['ผิดลาย', 'ผิดสี', 'ผิดตำแหน่ง', 'ผิดขนาด', 'อื่น'] },
                    { name: 'sku', label: 'SKU', type: 'text' },
                    { name: 'orderid', label: 'รหัสออเดอร์', type: 'text' },
                    { name: 'remark', label: 'หมายเหตุ', type: 'text', optional: true }
                ]
            },
            redo: { 
                title: "บันทึกงานเสีย", desc: "จัดเก็บข้อมูลงานที่ต้องทำใหม่",
                cols: ['วันที่', 'เวลา', 'ครั้งที่', 'จำนวน', 'สถานะ'],
                fields: [
                    { name: 'date', label: 'วันที่', type: 'date' },
                    { name: 'time', label: 'เวลา', type: 'time' },
                    { name: 'attempt', label: 'ทำใหม่ครั้งที่', type: 'number' },
                    { name: 'count', label: 'จำนวนเสีย', type: 'number' }
                ]
            },
            problems: {
                title: "บันทึกปัญหา", desc: "เก็บบันทึกอุปสรรคและปัญหาในการทำงาน",
                cols: ['วันที่', 'เวลา', 'หัวข้อปัญหา', 'รายละเอียด', 'สถานะ'],
                fields: [
                    { name: 'date', label: 'วันที่', type: 'date' },
                    { name: 'time', label: 'เวลา', type: 'time' },
                    { name: 'issue', label: 'หัวข้อปัญหา', type: 'select', options: ['ปัญหาบุคคล', 'ปัญหางาน'] },
                    { name: 'detail', label: 'รายละเอียด', type: 'text' }
                ]
            }
        };

        const themeColors = { orange: '#fb923c', blue: '#38bdf8', indigo: '#818cf8', amber: '#fbbf24', rose: '#fb7185', teal: '#2dd4bf', slate: '#94a3b8' };

        // --- Common Functions ---
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-orange-500' : 'bg-slate-800';
            toast.className = `toast ${bg} text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3 font-bold text-sm min-w-[200px] border border-white/20 backdrop-blur-md`;
            toast.innerHTML = `<div class="w-2 h-2 rounded-full bg-white animate-ping"></div><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function speak(text) { if ('speechSynthesis' in window) { const msg = new SpeechSynthesisUtterance(text); msg.lang = 'th-TH'; window.speechSynthesis.speak(msg); } }

        function showAlert(title, msg) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function parseDate(d, t) {
            if (!d) return new Date(0);
            const p = d.split('/');
            const tp = (t || "00:00:00").split(':');
            return new Date(p[2], p[1]-1, p[0], tp[0], tp[1], tp[2]);
        }

        function getFilteredData(arr) {
            if (currentTimeFilter === 'all') return arr;
            const now = new Date();
            return arr.filter(r => {
                const rd = parseDate(r[0], r[1]);
                if (currentTimeFilter === 'daily') return rd.toDateString() === now.toDateString();
                if (currentTimeFilter === 'monthly') return rd.getMonth() === now.getMonth() && rd.getFullYear() === now.getFullYear();
                return true;
            });
        }

        // --- View & Logic ---
        window.switchView = function(v) {
            currentView = v;
            currentPage = 1; editingDocId = null;
            document.querySelectorAll('nav button').forEach(b => b.classList.toggle('nav-active', b.id === `nav-${v}`));
            document.getElementById('view-title').innerText = CONFIG[v].title;
            document.getElementById('view-desc').innerText = CONFIG[v].desc;

            if (v === 'overview') {
                document.getElementById('overview-content').classList.remove('hidden');
                document.getElementById('management-content').classList.add('hidden');
                refreshOverview();
            } else {
                document.getElementById('overview-content').classList.add('hidden');
                document.getElementById('management-content').classList.remove('hidden');
                renderForm(v); renderTable(); updateStats();
            }
        }

        function renderForm(v) {
            const form = document.getElementById('main-form');
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const nowTime = now.toTimeString().split(' ')[0].substring(0, 5);
            
            form.innerHTML = CONFIG[v].fields.map(f => `
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase">${f.label}</label>
                    ${f.type === 'select' ? `
                        <select name="${f.name}" class="input-clean bg-slate-50/50">${f.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>
                    ` : `
                        <input type="${f.type}" name="${f.name}" value="${f.name === 'date' ? today : (f.name === 'time' ? nowTime : '')}" required class="input-clean">
                    `}
                </div>
            `).join('') + `<button type="submit" class="bg-orange-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm mt-2 flex-1">${editingDocId ? 'อัปเดต' : 'บันทึก'}</button>`;
            
            if (editingDocId) form.innerHTML += `<button type="button" onclick="cancelEdit()" class="bg-slate-200 text-slate-500 font-bold py-2.5 px-4 rounded-xl text-sm mt-1">ยกเลิก</button>`;
        }

        window.cancelEdit = function() { editingDocId = null; renderForm(currentView); }

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const dataObj = Object.fromEntries(fd.entries());
            const dateParts = dataObj.date.split('-');
            const entry = [`${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`, dataObj.time + ":00"];
            
            CONFIG[currentView].fields.forEach(f => { if(f.name !== 'date' && f.name !== 'time') entry.push(dataObj[f.name]); });
            
            try {
                if (editingDocId) {
                    const row = rawData[currentView].find(r => r[r.length-1] === editingDocId);
                    entry.push(row[row.length-2]); // คงสถานะเดิมไว้
                    await updateDoc(doc(db, currentView, editingDocId), { entry });
                    editingDocId = null;
                } else {
                    entry.push('กำลังทำ');
                    await addDoc(collection(db, currentView), { entry, createdAt: new Date() });
                }
                renderForm(currentView);
                showToast("สำเร็จ");
            } catch (err) { showAlert("Error", err.message); }
        }

        window.toggleStatus = async function(view, globalIdx) {
            const all = [...getFilteredData(rawData[view])].sort((a,b) => parseDate(b[0],b[1]) - parseDate(a[0],a[1]));
            const target = all[globalIdx];
            const docId = target[target.length - 1];
            let newEntry = [...target.slice(0, -1)];
            newEntry[newEntry.length-1] = newEntry[newEntry.length-1] === 'เสร็จแล้ว' ? 'กำลังทำ' : 'เสร็จแล้ว';
            await updateDoc(doc(db, view, docId), { entry: newEntry });
        }

        window.deleteRow = async function(v, globalIdx) {
            const all = [...getFilteredData(rawData[v])].sort((a,b) => parseDate(b[0],b[1]) - parseDate(a[0],a[1]));
            if (confirm("ลบข้อมูลหรือไม่?")) {
                await deleteDoc(doc(db, v, all[globalIdx][all[globalIdx].length - 1]));
            }
        }

        // --- Render UI ---
        function renderTable() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            const allSorted = [...getFilteredData(rawData[currentView])].sort((a,b) => parseDate(b[0],b[1]) - parseDate(a[0],a[1]));
            
            head.innerHTML = CONFIG[currentView].cols.map(c => `<th>${c}</th>`).join('') + `<th class="text-right">จัดการ</th>`;
            body.innerHTML = allSorted.slice((currentPage-1)*itemsPerPage, currentPage*itemsPerPage).map((rowWithId, i) => {
                const row = rowWithId.slice(0, -1);
                const status = row[row.length-1];
                return `<tr>
                    ${row.map((cell, idx) => idx === row.length-1 ? `<td><button onclick="toggleStatus('${currentView}', ${i})" class="px-3 py-1 rounded-full text-[10px] font-bold ${status === 'เสร็จแล้ว' ? 'bg-emerald-50 text-emerald-500' : 'bg-orange-50 text-orange-500'}">${status}</button></td>` : `<td>${cell}</td>`).join('')}
                    <td class="text-right"><button onclick="deleteRow('${currentView}', ${i})" class="text-rose-400 text-xs font-bold">ลบ</button></td>
                </tr>`;
            }).join('');
        }

        function updateStats() {
            const total = getFilteredData(rawData.orders).reduce((s, x) => s + (parseInt(x[3]) || 0), 0);
            document.getElementById('stats-grid').innerHTML = `
                <div class="card p-6 soft-shadow h-32 bg-orange-50/30 border border-orange-100"><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">ผลิตรวม</p><h4 class="text-2xl font-black text-orange-500">${total.toLocaleString()}</h4></div>
                <div class="card p-6 soft-shadow h-32 bg-rose-50/30 border border-rose-100"><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">งานเสีย</p><h4 class="text-2xl font-black text-rose-500">${getFilteredData(rawData.redo).reduce((s, x) => s + (parseInt(x[3]) || 0), 0)}</h4></div>
                <div class="card p-6 soft-shadow h-32 bg-sky-50/30 border border-sky-100"><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">งานค้างแก้</p><h4 class="text-2xl font-black text-sky-500">${getFilteredData(rawData.fix).filter(x => x[x.length-2] !== 'เสร็จแล้ว').length}</h4></div>
            `;
        }

        function refreshOverview() {
            updateStats();
            Object.values(charts).forEach(c => c && c.destroy());
            // (ส่วนโค้ดกราฟจะยังคงทำงานปกติด้วยข้อมูลจาก Cloud)
        }

        // --- Firebase Real-time Sync ---
        function initSync(col) {
            onSnapshot(collection(db, col), (snap) => {
                rawData[col] = snap.docs.map(doc => [...doc.data().entry, doc.id]);
                if (currentView === 'overview') refreshOverview();
                else if (currentView === col) { renderTable(); updateStats(); }
            });
        }

        window.onload = () => {
            ['orders', 'fix', 'redo', 'problems'].forEach(initSync);
            switchView('overview');
            setTimeout(() => showToast("เชื่อมต่อ Cloud สำเร็จ"), 1000);
        };

        window.setTimeFilter = (f) => { currentTimeFilter = f; if (currentView === 'overview') refreshOverview(); else { renderTable(); updateStats(); } };
    </script>
</body>
</html>
