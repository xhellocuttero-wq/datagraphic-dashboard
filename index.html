<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA GRAPHIC | WARROOM Edition (Cloud)</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1055/1055644.png" type="image/x-icon">
    
    <link href="./dist/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js" type="module"></script>
    <style>
        :root { --primary: #fb923c; --secondary: #38bdf8; --bg-main: #fdfcfb; --card-bg: #ffffff; --text-main: #334155; --text-sub: #94a3b8; }
        body { font-family: 'Inter', 'Sarabun', sans-serif; background-color: var(--bg-main); color: var(--text-main); transition: all 0.3s ease; }
        .soft-shadow { box-shadow: 0 10px 25px -5px rgba(251, 146, 60, 0.05), 0 8px 10px -6px rgba(56, 189, 248, 0.03); }
        .card { background: var(--card-bg); border: 1px solid #f8fafc; border-radius: 1.25rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        .nav-active { color: var(--primary); background: #fff7ed; font-weight: 600; box-shadow: inset 4px 0 0 var(--primary); }
        .filter-btn { font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 10px; color: var(--text-sub); transition: all 0.2s; }
        .filter-btn.active { color: white; background: var(--primary); box-shadow: 0 4px 12px rgba(251, 146, 60, 0.3); }
        .input-clean { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; font-size: 14px; outline: none; transition: all 0.2s; }
        .input-clean:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.1); }
        th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); padding: 14px 24px; border-bottom: 2px solid #fff7ed; }
        td { padding: 12px 24px; font-size: 14px; border-bottom: 1px solid #fdfcfb; }
        tr:hover { background: #fffbf7; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #fed7aa; border-radius: 10px; }
        .datepicker-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .datepicker-wrapper:hover { background: #fff7ed; }
        .datepicker-wrapper input[type="date"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        .check-all-box { width: 16px; height: 16px; accent-color: #fb923c; cursor: pointer; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div id="toast-container" class="fixed top-6 right-6 z-[200] flex flex-col gap-3"></div>
    <aside class="w-64 h-full bg-white border-r border-orange-50 flex flex-col p-6 z-50">
        <div class="mb-10 flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-orange-400 to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-orange-100 animate-pulse">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-slate-800 uppercase">DATA GRAPHIC</h1>
                <p class="text-[10px] text-orange-300 font-bold uppercase tracking-widest">WARROOM</p>
            </div>
        </div>
        <nav class="space-y-1.5 flex-1">
            <button onclick="switchView('overview')" id="nav-overview" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all nav-active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="text-sm">ภาพรวมระบบ</span>
            </button>
            <button onclick="switchView('orders')" id="nav-orders" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all text-slate-400 hover:bg-orange-50/50 hover:text-orange-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="text-sm">บันทึกงานผลิต</span>
            </button>
            <button onclick="switchView('fix')" id="nav-fix" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all text-slate-400 hover:bg-orange-50/50 hover:text-orange-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                <span class="text-sm">บันทึกงานแก้</span>
            </button>
            <button onclick="switchView('redo')" id="nav-redo" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all text-slate-400 hover:bg-orange-50/50 hover:text-orange-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span class="text-sm">บันทึกงานเสีย</span>
            </button>
            <button onclick="switchView('problems')" id="nav-problems" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all text-slate-400 hover:bg-orange-50/50 hover:text-orange-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span class="text-sm">บันทึกปัญหา</span>
            </button>
        </nav>
        <div class="mt-auto space-y-3">
            <div id="user-display" class="text-[10px] text-slate-400 font-bold mb-2 break-all px-2">กำลังยืนยันตัวตน...</div>
            <button onclick="document.getElementById('fileInput').click()" class="w-full py-3 rounded-xl bg-orange-500 text-white text-xs font-bold hover:bg-orange-600 transition-all shadow-lg shadow-orange-100">อัปโหลดไฟล์ (CSV)</button>
            <button onclick="exportAllData()" class="w-full py-3 rounded-xl border border-orange-100 text-orange-400 text-xs font-bold hover:bg-orange-50 transition-all">ดาวน์โหลด Report</button>
        </div>
    </aside>

    <main id="main-content-area" class="flex-1 flex flex-col p-8 overflow-y-auto">        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
            <div>
                <h2 id="view-title" class="text-2xl font-extrabold text-slate-800 tracking-tight">สรุปผลการทำงาน</h2>
                <p id="view-desc" class="text-sm text-slate-400 font-medium">ภาพรวมข้อมูลการผลิตและประสิทธิภาพรายแผนก</p>
            </div>           
            <div class="flex flex-wrap items-center p-1.5 bg-white rounded-2xl soft-shadow border border-orange-50 gap-1">
                <button onclick="setTimeFilter('daily')" id="filter-daily" class="filter-btn active">วันนี้</button>
                <button onclick="setTimeFilter('monthly')" id="filter-monthly" class="filter-btn">เดือนนี้</button>
                <button onclick="setTimeFilter('all')" id="filter-all" class="filter-btn">ทั้งหมด</button>
                <div class="h-6 w-[1px] bg-orange-100 mx-1"></div>
                <div class="datepicker-wrapper" title="เลือกวันที่">
                    <input type="date" id="custom-date-filter" onchange="setTimeFilter('custom', this.value)">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
            </div>
        </div>

        <div id="stats-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8"></div>

        <div id="overview-content" class="grid grid-cols-1 gap-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="card p-8 soft-shadow bg-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-orange-50 rounded-full -mr-16 -mt-16 opacity-40"></div>
                    <h3 class="text-[10px] font-black text-orange-400 uppercase tracking-widest mb-6">กราฟงานผลิตรายชั่วโมง</h3>
                    <div class="h-[250px]"><canvas id="ovOrderChart"></canvas></div>
                </div>
                <div class="card p-8 soft-shadow bg-white relative overflow-hidden">
                    <h3 class="text-[10px] font-black text-rose-400 uppercase tracking-widest mb-6">กราฟงานเสียรายชั่วโมง</h3>
                    <div class="h-[250px]"><canvas id="ovFixRedoChart"></canvas></div>
                </div>
            </div>
            <div class="card overflow-hidden soft-shadow">
                <div class="px-8 py-5 border-b border-orange-50 flex justify-between items-center bg-orange-50/20">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">รายการที่ยังไม่เสร็จ (ล่าสุด)</h3>
                </div>
                <div id="ovRecentList" class="divide-y divide-orange-50/50 max-h-[300px] overflow-y-auto"></div>
            </div>
        </div>

        <div id="management-content" class="hidden space-y-8">
            <div id="form-container" class="card p-8 soft-shadow bg-white border-orange-100 border-dashed border-2">
                <form id="main-form" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-4 items-end" onsubmit="handleFormSubmit(event)"></form>
            </div>
            <div class="card overflow-hidden soft-shadow">
                <div class="px-8 py-5 flex justify-between items-center bg-white border-b border-orange-50">
                    <div class="relative w-full max-w-xs">
                        <input type="text" id="search" onkeyup="filterTableSearch()" placeholder="ค้นหารายการ..." class="input-clean w-full pl-10">
                        <svg class="w-5 h-5 absolute left-3 top-2.5 text-orange-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <div id="pagination-info" class="text-[10px] font-bold text-slate-400 uppercase"></div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead><tr id="table-head"></tr></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
                <div id="pagination-controls" class="px-8 py-4 flex justify-center gap-2 border-t border-orange-50"></div>
            </div>
        </div>
    </main>

    <input type="file" id="fileInput" class="hidden" multiple onchange="handleFiles(event)">

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, onSnapshot, serverTimestamp, getDocs, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyA0QWdvnA4ubJ42OAHxnDDJQUHkIFasu3w",
            authDomain: "data-5c343.firebaseapp.com",
            projectId: "data-5c343",
            storageBucket: "data-5c343.firebasestorage.app",
            messagingSenderId: "555799172632",
            appId: "1:555799172632:web:ced0d5f789362a9228156d"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'default-app-id';

        let allFirebaseData = { orders: [], fix: [], redo: [], problems: [] };
        let currentView = 'overview';
        let currentTimeFilter = 'daily';
        let customDateValue = null;
        let currentPage = 1;
        const itemsPerPage = 50;
        let charts = {};
        let editingRealIdx = -1;
        let user = null;

        const CONFIG = {
            overview: { title: "สรุปผลการทำงาน", desc: "ภาพรวมข้อมูลจากทุกช่วงเวลา" },
            orders: { title: "บันทึกงานผลิต", cols: ['วันที่', 'เวลา', 'เลขที่งาน', 'จำนวน', 'แผนก', 'สีงาน', 'สถานะ'], fields: [{ name: 'date', label: 'วันที่', type: 'date' }, { name: 'time', label: 'เวลา', type: 'time' }, { name: 'id', label: 'เลขที่งาน', type: 'number' }, { name: 'count', label: 'จำนวน', type: 'number' }, { name: 'dept', label: 'แผนก', type: 'select', options: ['งานเรียง', 'งานล็อต', 'งานBY', 'งานเฉินผิง', 'งานด่วน'] }, { name: 'color', label: 'สีงาน', type: 'select', options: ['สีแดง', 'สีเหลือง', 'สีชมพู', 'สีเขียว', 'สีส้ม', 'สีฟ้า', 'สีม่วง', 'สีขาว'] }] },
            fix: { title: "รายการงานแก้", cols: ['วันที่และเวลา', 'รูปที่', 'ประเภท', 'รหัสSKU', 'รหัสออเดอร์', 'สถานะ'], fields: [{ name: 'datetime', label: 'วันที่และเวลา', type: 'datetime-local' }, { name: 'photo_no', label: 'รูปที่', type: 'number' }, { name: 'type', label: 'ประเภท', type: 'select', options: ['ผิดลาย', 'ผิดสี', 'ผิดตำแหน่ง', 'ผิดขนาด', 'อื่น'] }, { name: 'sku', label: 'รหัสSKU', type: 'text' }, { name: 'orderid', label: 'รหัสออเดอร์', type: 'text' }] },
            redo: { title: "บันทึกงานเสีย", cols: ['วันที่', 'เวลา', 'ครั้งที่', 'จำนวน', 'สถานะ'], fields: [{ name: 'date', label: 'วันที่', type: 'date' }, { name: 'time', label: 'เวลา', type: 'time' }, { name: 'attempt', label: 'ทำใหม่ครั้งที่', type: 'number' }, { name: 'count', label: 'จำนวนเสีย', type: 'number' }] },
            problems: { title: "บันทึกปัญหา", cols: ['วันที่', 'เวลา', 'หัวข้อปัญหา', 'รายละเอียด', 'สถานะ'], fields: [{ name: 'date', label: 'วันที่', type: 'date' }, { name: 'time', label: 'เวลา', type: 'time' }, { name: 'issue', label: 'หัวข้อปัญหา', type: 'select', options: ['ปัญหาบุคคล', 'ปัญหางาน'] }, { name: 'detail', label: 'รายละเอียด', type: 'text' }] }
        };

        const themeColors = { orange: '#fb923c', blue: '#38bdf8', indigo: '#818cf8', rose: '#fb7185' };

        // Helper: แปลงวันที่จาก String 21/11/2568 เป็น Date object
        function parseThaiDate(str) {
            if (!str) return new Date(0);
            const parts = str.split(' ')[0].split('/');
            if (parts.length < 3) return new Date(0);
            let y = parseInt(parts[2]);
            if (y > 2500) y -= 543; // แปลง พ.ศ. เป็น ค.ศ.
            return new Date(y, parseInt(parts[1]) - 1, parseInt(parts[0]));
        }

        onAuthStateChanged(auth, (u) => { 
            user = u; 
            if (u) {
                document.getElementById('user-display').innerText = `ID: ${u.uid.substring(0,6)}`;
                syncAllData(); 
            } else {
                signInAnonymously(auth);
            }
        });

        // ดึงข้อมูลทั้งหมดมาไว้ใน memory เพื่อความเร็วและกราฟที่แม่นยำ
        async function syncAllData() {
            const collections = ['orders', 'fix', 'redo', 'problems'];
            collections.forEach(col => {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', col), orderBy('timestamp', 'desc'));
                onSnapshot(q, (snap) => {
                    allFirebaseData[col] = snap.docs.map(d => ({ firebaseId: d.id, data: d.data().data }));
                    renderCurrentView();
                });
            });
        }

        function setTimeFilter(f, val = null) {
            currentTimeFilter = f;
            customDateValue = val;
            currentPage = 1;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.id === `filter-${f}`));
            renderCurrentView();
        }

        function switchView(v) {
            currentView = v;
            currentPage = 1;
            document.querySelectorAll('nav button').forEach(b => b.classList.toggle('nav-active', b.id === `nav-${v}`));
            document.getElementById('view-title').innerText = CONFIG[v].title;
            if (v === 'overview') {
                document.getElementById('overview-content').classList.remove('hidden');
                document.getElementById('management-content').classList.add('hidden');
            } else {
                document.getElementById('overview-content').classList.add('hidden');
                document.getElementById('management-content').classList.remove('hidden');
                renderForm(v);
            }
            renderCurrentView();
        }

        function getFilteredData(colName) {
            const raw = allFirebaseData[colName];
            const now = new Date();
            const todayStr = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear() + 543}`;

            return raw.filter(item => {
                const itemDateStr = item.data[0].toString().split(' ')[0]; // ดึง "21/11/2568"
                
                if (currentTimeFilter === 'daily') return itemDateStr === todayStr;
                if (currentTimeFilter === 'monthly') {
                    const d = parseThaiDate(itemDateStr);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                }
                if (currentTimeFilter === 'custom' && customDateValue) {
                    const p = customDateValue.split('-');
                    const cStr = `${p[2]}/${p[1]}/${parseInt(p[0])+543}`;
                    return itemDateStr === cStr;
                }
                return true; // All
            });
        }

        function renderCurrentView() {
            if (currentView === 'overview') {
                renderOverview();
            } else {
                renderTable();
            }
            updateStats();
        }

        function renderTable() {
            const data = getFilteredData(currentView);
            const body = document.getElementById('table-body');
            const head = document.getElementById('table-head');
            
            head.innerHTML = CONFIG[currentView].cols.map(c => `<th>${c}</th>`).join('') + `<th>จัดการ</th>`;
            
            const start = (currentPage - 1) * itemsPerPage;
            const display = data.slice(start, start + itemsPerPage);

            body.innerHTML = display.map((item, idx) => `
                <tr class="hover:bg-slate-50">
                    ${item.data.map((cell, i) => `<td>${cell}</td>`).join('')}
                    <td><button onclick="deleteRow('${currentView}', '${item.firebaseId}')" class="text-rose-500 text-xs font-bold">ลบ</button></td>
                </tr>
            `).join('') || '<tr><td colspan="10" class="text-center py-10 text-slate-400">ไม่มีข้อมูล</td></tr>';

            document.getElementById('pagination-info').innerText = `หน้า ${currentPage} (ทั้งหมด ${data.length} รายการ)`;
        }

        function updateStats() {
            const orders = getFilteredData('orders');
            const total = orders.reduce((sum, i) => sum + (parseInt(i.data[3]) || 0), 0);
            const redo = getFilteredData('redo').reduce((sum, i) => sum + (parseInt(i.data[3]) || 0), 0);
            
            document.getElementById('stats-grid').innerHTML = `
                <div class="card p-6 soft-shadow"><p class="text-[9px] font-black text-slate-400 uppercase">ยอดผลิตรวม</p><h4 class="text-2xl font-black text-orange-500">${total.toLocaleString()}</h4></div>
                <div class="card p-6 soft-shadow"><p class="text-[9px] font-black text-slate-400 uppercase">ยอดเสียรวม</p><h4 class="text-2xl font-black text-rose-500">${redo.toLocaleString()}</h4></div>
                <div class="card p-6 soft-shadow"><p class="text-[9px] font-black text-slate-400 uppercase">จำนวนรายการ</p><h4 class="text-2xl font-black text-sky-500">${orders.length}</h4></div>
            `;
        }

        function renderOverview() {
            Object.values(charts).forEach(c => c && c.destroy());
            const orders = getFilteredData('orders');
            const labels = Array.from({length: 16}, (_, i) => `${(i+8).toString().padStart(2,'0')}:30`);
            
            charts.ovOrder = new Chart(document.getElementById('ovOrderChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'จำนวนงานผลิต',
                        data: labels.map(l => orders.filter(o => o.data[1].includes(l.split(':')[0])).reduce((s,o)=>s+(parseInt(o.data[3])||0),0)),
                        borderColor: themeColors.orange,
                        backgroundColor: themeColors.orange + '22',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // รายการล่าสุด
            const recent = [...getFilteredData('orders'), ...getFilteredData('fix')].slice(0, 5);
            document.getElementById('ovRecentList').innerHTML = recent.map(r => `
                <div class="px-8 py-4 flex justify-between items-center">
                    <div><p class="text-sm font-bold text-slate-700">${r.data[2] || r.data[3]}</p><p class="text-[10px] text-slate-400">${r.data[0]}</p></div>
                    <span class="text-[10px] px-2 py-1 bg-orange-50 text-orange-500 rounded">${r.data[r.data.length-1]}</span>
                </div>
            `).join('');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const inputs = Array.from(e.target.querySelectorAll('input, select')).filter(i => i.name);
            const rowData = inputs.map(i => {
                if (i.type === 'date') {
                    const [y, m, d] = i.value.split('-');
                    return `${d}/${m}/${parseInt(y)+543}`;
                }
                return i.value;
            });
            rowData.push("รอดำเนินการ");
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', currentView), { data: rowData, timestamp: serverTimestamp() });
            e.target.reset();
            showToast("บันทึกสำเร็จ");
        }

        async function deleteRow(col, id) {
            if (confirm('ลบรายการนี้?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id));
                showToast("ลบข้อมูลแล้ว");
            }
        }

        async function handleFiles(e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const rows = ev.target.result.split('\n').slice(1);
                    for (const row of rows) {
                        const cleanRow = row.split(',').map(c => c.trim().replace(/"/g, ''));
                        if (cleanRow.length > 1) {
                            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', currentView), { 
                                data: cleanRow, 
                                timestamp: serverTimestamp() 
                            });
                        }
                    }
                    showToast("นำเข้าข้อมูลสำเร็จ");
                };
                reader.readAsText(file);
            }
        }

        function renderForm(v) {
            const form = document.getElementById('main-form');
            form.innerHTML = CONFIG[v].fields.map(f => `
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase">${f.label}</label>
                    ${f.type === 'select' ? 
                        `<select name="${f.name}" class="input-clean">${f.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>` :
                        `<input type="${f.type}" name="${f.name}" required class="input-clean">`
                    }
                </div>
            `).join('') + `<button type="submit" class="bg-orange-500 text-white font-bold py-2 px-4 rounded-xl text-sm h-[40px]">บันทึก</button>`;
        }

        function showToast(m) {
            const t = document.createElement('div');
            t.className = "bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl font-bold text-sm mb-2";
            t.innerText = m;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        window.switchView = switchView;
        window.setTimeFilter = setTimeFilter;
        window.handleFormSubmit = handleFormSubmit;
        window.deleteRow = deleteRow;
        window.handleFiles = handleFiles;
    </script>
</body>
</html>
