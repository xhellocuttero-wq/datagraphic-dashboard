<!DOCTYPE html>
<html lang="th">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>

    <style>
        :root {
            --primary: #fb923c; /* Soft Orange */
            --secondary: #38bdf8; /* Soft Blue */
            --bg-main: #fdfcfb; /* Very Light Warm Grey */
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-sub: #94a3b8;
        }
        body { 
            font-family: 'Inter', 'Sarabun', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main);
            transition: all 0.3s ease;
        }
        .soft-shadow {
            box-shadow: 0 10px 25px -5px rgba(251, 146, 60, 0.05), 0 8px 10px -6px rgba(56, 189, 248, 0.03);
        }
        .card { 
            background: var(--card-bg); 
            border: 1px solid #f8fafc;
            border-radius: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .nav-active {
            color: var(--primary);
            background: #fff7ed;
            font-weight: 600;
            box-shadow: inset 4px 0 0 var(--primary);
        }
        .filter-btn {
            font-size: 11px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 10px;
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .filter-btn.active {
            color: white;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(251, 146, 60, 0.3);
        }
        .input-clean {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .input-clean:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.1); }
        
        th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); padding: 14px 24px; border-bottom: 2px solid #fff7ed; }
        td { padding: 12px 24px; font-size: 14px; border-bottom: 1px solid #fdfcfb; }
        tr:hover { background: #fffbf7; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #fed7aa; border-radius: 10px; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes viewEntrance {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .view-animate {
            animation: viewEntrance 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .datepicker-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .datepicker-wrapper:hover { background: #fff7ed; }
        .datepicker-wrapper input[type="date"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }
        .datepicker-wrapper svg {
            position: relative;
            z-index: 1;
            color: #fb923c;
        }
        .check-all-box { width: 16px; height: 16px; accent-color: #fb923c; cursor: pointer; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);

                    await signInAnonymously(auth);

        function syncData() {
    if (!user) return;

    // หยุดการเชื่อมต่อเดิมทั้งหมดก่อนเริ่มใหม่ เพื่อป้องกัน Listener ซ้อนกัน
    activeListeners.forEach(unsub => unsub());
    activeListeners = [];

    const collections = ['orders', 'fix', 'redo', 'problems'];
    collections.forEach(col => {
        // จำกัดการดึงข้อมูลเฉพาะ 300 รายการล่าสุด และเรียงตามเวลา
        const q = query(
            collection(db, 'artifacts', appId, 'public', 'data', col),
            orderBy("timestamp", "desc"),
            limit(300)
        );

        const unsubscribe = onSnapshot(q, (snapshot) => {
            rawData[col] = snapshot.docs.map(doc => {
                let itemData = doc.data().data;
                // สำคัญ: เก็บ Firebase ID ไว้ในตัวข้อมูลเพื่อใช้แก้ไข/ลบ โดยไม่ต้อง Query ซ้ำ
                itemData._fbId = doc.id; 
                return itemData;
            });
            
            if (currentView === 'overview') refreshOverview(); 
            else {
                renderTable();
                updateStats();
            }
        });
        
        // บันทึกตัวหยุดการเชื่อมต่อไว้ใน Array
        activeListeners.push(unsubscribe);
    });
}

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-orange-500' : type === 'info' ? 'bg-sky-500' : 'bg-slate-800';
            toast.className = `toast ${bg} text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3 font-bold text-sm min-w-[200px] border border-white/20 backdrop-blur-md`;
            toast.innerHTML = `<div class="w-2 h-2 rounded-full bg-white animate-ping"></div><span>${msg}</span>`;

        function speak(text) { if ('speechSynthesis' in window) { const msg = new SpeechSynthesisUtterance(text); msg.lang = 'th-TH'; msg.rate = 1.1; window.speechSynthesis.speak(msg); } }
        function showAlert(title, msg) { document.getElementById('alert-title').innerText = title; document.getElementById('alert-msg').innerText = msg; document.getElementById('alert-modal').classList.remove('hidden'); speak(msg); }
        
        function parseDate(d, t) { 
            if (!d) return new Date(0); 
            if (d.includes(',')) {
                let dtStr = d.replace(/"/g, '');
                const parts = dtStr.split(',');
                if (parts.length >= 2) {
                    const dParts = parts[0].trim().split('/');
                    if (dParts.length === 3) {
                        let year = parseInt(dParts[2]);
                        if (year > 2500) year -= 543;
                        return new Date(`${year}-${dParts[1].padStart(2,'0')}-${dParts[0].padStart(2,'0')}T${parts[1].trim()}`);
                    }
                }
                return new Date(dtStr);
            }
            const p = d.split('/');
            const tp = (t || "00:00:00").split(':'); 
            if (p.length < 3) return new Date(0); 
            let year = parseInt(p[2]);
            if (year > 2500) year -= 543; 
            return new Date(year, p[1]-1, p[0], tp[0], tp[1], tp[2]); 
        }

        function getFilteredData(arr) {
            if (currentTimeFilter === 'all') return arr;
            const now = new Date();
            return arr.filter(r => {
                const rd = parseDate(r[0], r[1]);
                if (currentTimeFilter === 'daily') return rd.toDateString() === now.toDateString();
                if (currentTimeFilter === 'monthly') return rd.getMonth() === now.getMonth() && rd.getFullYear() === now.getFullYear();
                if (currentTimeFilter === 'custom' && customDateValue) {
                    const target = new Date(customDateValue);
                    return rd.toDateString() === target.toDateString();
                }
                return true;
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (!user) return;
            const fd = new FormData(e.target);
            const dataObj = Object.fromEntries(fd.entries());
            
            Object.keys(dataObj).forEach(k => stickyValues[currentView][k] = dataObj[k]);

            let entry = [];
            if (currentView === 'fix') {
                const dt = new Date(dataObj.datetime);
                const dtStr = `"${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()}, ${dt.getHours()}:${dt.getMinutes().toString().padStart(2,'0')}:${dt.getSeconds().toString().padStart(2,'0')}"`;
                entry = [dtStr, dataObj.photo_no, dataObj.type, dataObj.sku, dataObj.orderid];
            } else {
                const dateParts = dataObj.date.split('-');
                const dateStr = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;
                let timeStr = dataObj.time; if (timeStr.split(':').length === 2) timeStr += ":00";
                entry = [dateStr, timeStr];
                CONFIG[currentView].fields.forEach(f => { if(f.name!=='date'&&f.name!=='time') entry.push(dataObj[f.name]); });
            }
            
            try {
                if (editingRealIdx > -1) {
                    const sorted = [...getFilteredData(rawData[currentView])].sort((a,b) => parseDate(b[0],b[1]) - parseDate(a[0],a[1]));
                    const target = sorted[editingRealIdx];
                    entry.push(target[target.length - 1]); // keep status
                    const q = collection(db, 'artifacts', appId, 'public', 'data', currentView);
                    onSnapshot(q, async (snapshot) => {
                        const targetDoc = snapshot.docs.find(d => JSON.stringify(d.data().data) === JSON.stringify(target));
                        if (targetDoc) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentView, targetDoc.id), { data: entry });
                    }, (e)=>{}, {once: true});
                    editingRealIdx = -1;
                    showToast("อัปเดตสำเร็จ");
                } else {
                    entry.push('กำลังทำ');
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', currentView), { data: entry, timestamp: new Date() });
                    showToast("บันทึกสำเร็จ");
                }
                renderForm(currentView);
            } catch (err) { showToast("เกิดข้อผิดพลาด", "error"); }
        }

        async function toggleStatus(view, globalIdx) {
            if (!user) return;
            const allInView = [...getFilteredData(rawData[view])].sort((a,b) => parseDate(b[0],b[1]) - parseDate(a[0],a[1]));
            const targetRow = allInView[globalIdx];
            if (!targetRow) return;
            let nextStatus = (targetRow[targetRow.length - 1] === 'เสร็จแล้ว' || targetRow[targetRow.length - 1] === 'TRUE') ? 'กำลังทำ' : 'เสร็จแล้ว';
            const updatedRow = [...targetRow]; updatedRow[updatedRow.length - 1] = nextStatus;
            const q = collection(db, 'artifacts', appId, 'public', 'data', view);
            onSnapshot(q, async (snapshot) => {
                const targetDoc = snapshot.docs.find(d => JSON.stringify(d.data().data) === JSON.stringify(targetRow));
                if (targetDoc) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', view, targetDoc.id), { data: updatedRow });
            }, (e) => {}, { once: true });
        }

        async function deleteRow(v, globalIdx) {

        function toggleRowSelection(rowJson) {

        function toggleAllSelection(isChecked) {

            const totalItems = allInView.length;
            const start = (currentPage - 1) * itemsPerPage;
            const displayData = allInView.slice(start, start + itemsPerPage);
            
            displayData.forEach(row => {

        async function deleteSelectedRows() {
            if (!user || selectedRowKeys.size === 0) return;
            if (!confirm(`ยืนยันการลบทั้งหมด ${selectedRowKeys.size} รายการ?`)) return;
            
            const keysToDelete = Array.from(selectedRowKeys);
            const q = collection(db, 'artifacts', appId, 'public', 'data', currentView);
            
            onSnapshot(q, async (snapshot) => {
                let deletedCount = 0;
                for (const rowJson of keysToDelete) {
                    const targetData = JSON.parse(rowJson);
                    const targetDoc = snapshot.docs.find(d => JSON.stringify(d.data().data) === JSON.stringify(targetData));
                    if (targetDoc) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', currentView, targetDoc.id));
                        deletedCount++;
                    }
                }
                selectedRowKeys.clear();
                updateBulkDeleteUI();
                showToast(`ลบสำเร็จ ${deletedCount} รายการ`);

        function updateStats() {
            const o = getFilteredData(rawData.orders); const r = getFilteredData(rawData.redo); const f = getFilteredData(rawData.fix);
            const total = o.reduce((s, x) => s + (parseInt(x[3]) || 0), 0);
            const totalRedo = r.reduce((s, x) => s + (parseInt(x[3]) || 0), 0);
            const pending = f.filter(x => x[x.length-1] !== 'เสร็จแล้ว' && x[x.length-1] !== 'TRUE').length;
            const items = [{ label: "ยอดผลิตรวมทั้งหมด", val: total.toLocaleString(), color: "text-orange-500", bg: "bg-orange-50" },{ label: "จำนวนงานเสียรวม", val: totalRedo.toLocaleString(), color: "text-rose-500", bg: "bg-rose-50" },{ label: "งานแก้ที่ค้างอยู่", val: pending, color: "text-sky-500", bg: "bg-sky-50" }];
            document.getElementById('stats-grid').innerHTML = items.map(s => `<div class="card p-6 soft-shadow flex flex-col justify-between h-32 relative overflow-hidden group hover:scale-[1.03]"><div class="absolute -right-2 -bottom-2 w-12 h-12 ${s.bg} rounded-full opacity-20 group-hover:scale-150 transition-transform duration-500"></div><p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] relative z-10">${s.label}</p><h4 class="text-2xl font-black ${s.color} relative z-10">${s.val}</h4></div>`).join('');
        }

        function refreshOverview() {
            updateStats();
            Object.values(charts).forEach(c => c && c.destroy());
            const orders = getFilteredData(rawData.orders); const redo = getFilteredData(rawData.redo); const fix = getFilteredData(rawData.fix);
            const labels = []; for (let h = 8; h <= 23; h++) labels.push(`${h.toString().padStart(2, '0')}:30`);
            const getBucket = (t) => { if(!t) return null; const p = t.toString().includes(',') ? t.toString().split(',')[1].trim().split(':') : t.toString().split(':'); const h = parseInt(p[0]); if (isNaN(h) || h < 8) return null; return `${h.toString().padStart(2, '0')}:30`; };
            const depts = ['งานเรียง', 'งานล็อต', 'งานBY', 'งานเฉินผิง', 'งานด่วน'];
            const hrMap = {}; orders.forEach(r => { const b = getBucket(r[1]); if (!b) return; const d = r[4]; const v = parseInt(r[3]) || 0; if(!hrMap[b]) hrMap[b] = {}; if (depts.includes(d)) hrMap[b][d] = (hrMap[b][d] || 0) + v; });
            const deptDatasets = depts.map((d, i) => { const colors = [themeColors.orange, themeColors.blue, themeColors.indigo, themeColors.amber, themeColors.rose]; return { label: d, data: labels.map(l => (hrMap[l] && hrMap[l][d]) || 0), borderColor: colors[i], backgroundColor: colors[i] + '22', borderWidth: 2, fill: true, tension: 0.3 } });
            charts.ovOrder = new Chart(document.getElementById('ovOrderChart'), { type: 'line', data: { labels, datasets: deptDatasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10 } } } } } });
            const redoHrMap = {}; redo.forEach(r => { const b = getBucket(r[1]); if (b) redoHrMap[b] = (redoHrMap[b] || 0) + (parseInt(r[3]) || 0); });
            const fixHrMap = {}; const fixTypeMap = {}; fix.forEach(r => { const b = getBucket(r[0]); if (b) fixHrMap[b] = (fixHrMap[b] || 0) + 1; const t = r[2]; if(t) fixTypeMap[t] = (fixTypeMap[t] || 0) + 1; });
            charts.ovFixRedo = new Chart(document.getElementById('ovFixRedoChart'), { type: 'bar', data: { labels, datasets: [{ label: 'งานเสีย', data: labels.map(l => redoHrMap[l] || 0), backgroundColor: themeColors.rose, borderRadius: 4 },{ label: 'งานแก้', data: labels.map(l => fixHrMap[l] || 0), backgroundColor: themeColors.indigo, borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false } });
            charts.ovFixTypePie = new Chart(document.getElementById('ovFixTypePieChart'), { type: 'doughnut', data: { labels: Object.keys(fixTypeMap), datasets: [{ data: Object.values(fixTypeMap), backgroundColor: [themeColors.orange, themeColors.blue, themeColors.indigo, themeColors.rose, themeColors.amber, themeColors.teal], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%' } });
            const pOrders = orders.filter(o => (o[o.length-1] !== 'เสร็จแล้ว' && o[o.length-1] !== 'TRUE')).map(o => ({ t: 'งานผลิต', id: o[2], d: o[0], h: o[1], c: 'text-orange-400', view: 'orders' }));
            const pFix = fix.filter(f => (f[f.length-1] !== 'เสร็จแล้ว' && f[f.length-1] !== 'TRUE')).map(f => ({ t: 'งานแก้', id: f[4]||f[3], d: f[0], h: '', c: 'text-indigo-400', view: 'fix' }));
            const allPending = [...pOrders, ...pFix].sort((a,b) => parseDate(b.d, b.h) - parseDate(a.d, a.h)).slice(0, 10);
            document.getElementById('ovRecentList').innerHTML = allPending.map(i => `<div class="px-8 py-4 flex justify-between items-center bg-white hover:bg-orange-50/20"><div><span class="text-[9px] font-black ${i.c} uppercase">${i.t} #${i.id}</span><p class="text-[10px] text-slate-300 font-bold">${i.d.toString().replace(/"/g,'')}</p></div><button onclick="directToggleStatus('${i.view}', '${i.id}')" class="px-3 py-1 bg-orange-50 text-orange-500 text-[9px] font-black rounded-lg">กำลังทำ</button></div>`).join('') || '<div class="py-16 text-center text-slate-200">ไม่มีงานค้าง</div>';
        }

        function directToggleStatus(view, id) {
            const row = rawData[view].find(r => r[2] == id || r[3] == id || r[4] == id);
            if(row) toggleStatus(view, [...getFilteredData(rawData[view])].sort((a,b) => parseDate(b[0],b[1]) - parseDate(a[0],a[1])).indexOf(row));
        }

        function filterTableSearch() { const q = document.getElementById('search').value.toLowerCase(); document.querySelectorAll('#table-body tr').forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none'); }

        async function handleFiles(e) {
            if (!user) return;
            const files = Array.from(e.target.files);
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const lines = ev.target.result.split('\n').filter(l => l.trim());
                    const header = lines[0].toLowerCase();
                    const data = lines.slice(1).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
                    let targetCol = header.includes('แผนก') ? "orders" : header.includes('sku') ? "fix" : header.includes('ครั้งที่') ? "redo" : "";
                    if (targetCol) {
                        for (const row of data) if(row.length>0) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', targetCol), { data: row, timestamp: new Date() });
                        showToast("อัปโหลดสำเร็จ");
                    }
                };
                reader.readAsText(file);
            }
        }

        function exportAllData() {
            let csv = "\ufeffType,Date,Time,V1,V2,V3,V4,V5,Status\n";
            Object.keys(rawData).forEach(k => rawData[k].forEach(r => csv += `${k.toUpperCase()},${r.join(',')}\n`));
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Report_Production.csv`; link.click();
        }

        window.onload = async () => { await initAuth(); switchView('overview'); };
    </script>
</body>

</html>
