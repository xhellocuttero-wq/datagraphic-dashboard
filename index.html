<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA Graphic - Dashboard System (Cloud)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f5f1ed;
            --accent-orange: #ffb347;
            --accent-soft: #ffe4bc;
            --text-dark: #4a3728;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
        }

        .page {
            display: none;
            padding: 1.5rem;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(74, 55, 40, 0.05);
            border-radius: 24px;
        }

        .active { color: var(--accent-orange) !important; }
        
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="w-12 h-12 border-4 border-orange-200 border-t-orange-400 rounded-full animate-spin mb-4"></div>
        <p class="text-stone-400 animate-pulse text-sm">กำลังเชื่อมต่อฐานข้อมูล...</p>
    </div>

    <!-- Main Navigation -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 glass px-6 py-4 flex items-center gap-8 z-50">
        <button onclick="showPage('dashboard')" class="flex flex-col items-center gap-1 text-stone-400 hover:text-orange-400 transition-all">
            <i data-lucide="layout-dashboard" size="20"></i>
            <span class="text-[10px]">สรุป</span>
        </button>
        <button onclick="showPage('input')" class="flex flex-col items-center gap-1 text-stone-400 hover:text-orange-400 transition-all">
            <i data-lucide="plus-circle" size="20"></i>
            <span class="text-[10px]">ลงงาน</span>
        </button>
        <button onclick="showPage('datalist')" class="flex flex-col items-center gap-1 text-stone-400 hover:text-orange-400 transition-all">
            <i data-lucide="list" size="20"></i>
            <span class="text-[10px]">จัดการ</span>
        </button>
        <div class="h-6 w-px bg-stone-200"></div>
        <label class="flex flex-col items-center gap-1 text-stone-400 hover:text-orange-400 cursor-pointer transition-all">
            <i data-lucide="upload-cloud" size="20"></i>
            <span class="text-[10px]">Import</span>
            <input type="file" id="csv-file" accept=".csv" class="hidden" onchange="window.importCSV(event)">
        </label>
    </nav>

    <div class="max-w-4xl mx-auto pb-32 pt-8 px-4">
        
        <!-- PAGE: Dashboard -->
        <div id="dashboard" class="page">
            <header class="mb-8">
                <h1 class="text-3xl font-bold mb-2">Graphic Overview</h1>
                <p class="text-stone-400 text-sm">สรุปความคืบหน้างานประจำวัน</p>
            </header>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="glass p-5 text-center">
                    <p class="text-[10px] text-stone-400 uppercase mb-1">งานหลักรวม</p>
                    <h3 id="total-jobs" class="text-2xl font-bold text-orange-400">0</h3>
                </div>
                <div class="glass p-5 text-center border-l-4 border-l-green-400">
                    <p class="text-[10px] text-stone-400 uppercase mb-1">สำเร็จ (DONE)</p>
                    <h3 id="done-jobs" class="text-2xl font-bold text-green-500">0</h3>
                </div>
                <div class="glass p-5 text-center border-l-4 border-l-blue-400">
                    <p class="text-[10px] text-stone-400 uppercase mb-1">งานแก้ใหม่</p>
                    <h3 id="edit-jobs" class="text-2xl font-bold text-blue-500">0</h3>
                </div>
                <div class="glass p-5 text-center border-l-4 border-l-red-400">
                    <p class="text-[10px] text-stone-400 uppercase mb-1">งานผิดพลาด</p>
                    <h3 id="error-jobs" class="text-2xl font-bold text-red-500">0</h3>
                </div>
            </div>

            <div class="glass p-6 mb-8">
                <canvas id="mainChart" height="150"></canvas>
            </div>
        </div>

        <!-- PAGE: Input (ลงงานใหม่) -->
        <div id="input" class="page">
            <h2 class="text-2xl font-bold mb-6">ลงข้อมูลงานใหม่</h2>
            <div class="glass p-6 space-y-4">
                <div>
                    <label class="block text-xs text-stone-400 mb-2 px-1">รหัสออเดอร์</label>
                    <input type="text" id="order-id" placeholder="ระบุเลขที่ออเดอร์" class="w-full p-4 rounded-2xl border border-stone-100 outline-none focus:ring-2 focus:ring-orange-100 bg-stone-50/50">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-stone-400 mb-2 px-1">จำนวน (PCS)</label>
                        <input type="number" id="order-qty" placeholder="0" class="w-full p-4 rounded-2xl border border-stone-100 outline-none focus:ring-2 focus:ring-orange-100 bg-stone-50/50">
                    </div>
                    <div>
                        <label class="block text-xs text-stone-400 mb-2 px-1">แผนก</label>
                        <select id="order-dept" class="w-full p-4 rounded-2xl border border-stone-100 outline-none focus:ring-2 focus:ring-orange-100 bg-stone-50/50 appearance-none">
                            <option value="งานล็อต">งานล็อต</option>
                            <option value="งานBY">งานBY</option>
                            <option value="งานเรียง">งานเรียง</option>
                            <option value="งานเฉินผิง">งานเฉินผิง</option>
                        </select>
                    </div>
                </div>
                <button onclick="window.submitJob()" class="w-full py-4 bg-orange-400 text-white rounded-2xl font-bold shadow-lg shadow-orange-100 hover:bg-orange-500 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="save" size="20"></i> บันทึกข้อมูล
                </button>
            </div>
        </div>

        <!-- PAGE: Datalist (จัดการงาน) -->
        <div id="datalist" class="page">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <h2 class="text-2xl font-bold">จัดการข้อมูล</h2>
                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    <select id="data-type-filter" onchange="window.renderJobTable()" class="p-2 rounded-xl border border-stone-200 text-xs bg-white outline-none">
                        <option value="jobs">งานหลัก (Jobs)</option>
                        <option value="edit_logs">งานแก้ใหม่ (Edit Logs)</option>
                        <option value="corrections">งานผิดพลาดรายชิ้น (Corrections)</option>
                    </select>
                    <div class="relative flex-1 md:w-48">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-stone-300" size="14"></i>
                        <input type="text" id="job-search" onkeyup="window.filterJobs()" placeholder="ค้นหา..." class="w-full pl-9 p-2 text-xs rounded-xl border border-stone-200 outline-none">
                    </div>
                </div>
            </div>

            <div class="glass overflow-hidden overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead id="table-head" class="bg-stone-50 border-b border-stone-100 text-stone-400 uppercase font-bold text-[10px]">
                        <!-- Head injected by JS -->
                    </thead>
                    <tbody id="job-table-body" class="divide-y divide-stone-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // *** เปลี่ยนเป็น Firebase Config ของคุณ ***
        const firebaseConfig = {
  apiKey: "AIzaSyA0QWdvnA4ubJ42OAHxnDDJQUHkIFasu3w",
  authDomain: "data-5c343.firebaseapp.com",
  projectId: "data-5c343",
  storageBucket: "data-5c343.firebasestorage.app",
  messagingSenderId: "555799172632",
  appId: "1:555799172632:web:ced0d5f789362a9228156d",
  measurementId: "G-S132TKE0NB"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "my-data-system"; // Unique ID for your app data

        let state = { jobs: [], edit_logs: [], corrections: [] };
        let chartInstance = null;

        // --- AUTH & LOAD ---
        window.onload = () => {
            const secret = "0000";
            const pass = prompt("กรุณาใส่รหัสผ่าน:");
            if (pass === secret) {
                initAuth();
                window.showPage('dashboard');
                lucide.createIcons();
            } else {
                document.getElementById('loader').style.display = 'none';
                alert("รหัสผ่านไม่ถูกต้อง");
                document.body.innerHTML = `<div class="h-screen flex items-center justify-center bg-stone-100"><p class="text-red-500 font-bold">❌ ปฏิเสธการเข้าถึง</p></div>`;
            }
        };

        async function initAuth() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        setupListeners();
                        document.getElementById('loader').style.display = 'none';
                    }
                });
            } catch (e) {
                alert("Firebase Connection Error: " + e.message);
            }
        }

        function setupListeners() {
            // Jobs
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'jobs'), orderBy('createdAt', 'desc')), (snap) => {
                state.jobs = snap.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
                refreshUI();
            });
            // Edit Logs
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'edit_logs'), (snap) => {
                state.edit_logs = snap.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
                refreshUI();
            });
            // Corrections
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'corrections'), (snap) => {
                state.corrections = snap.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
                refreshUI();
            });
        }

        // --- DATA MANAGEMENT ---
        window.submitJob = async () => {
            const id = document.getElementById('order-id').value;
            const qty = document.getElementById('order-qty').value;
            const dept = document.getElementById('order-dept').value;
            if(!id || !qty) return alert("กรุณาระบุข้อมูลให้ครบ");

            const now = new Date();
            const jobData = {
                id, qty: parseInt(qty), dept,
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString(),
                status: 'FALSE',
                createdAt: serverTimestamp()
            };

            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'jobs'), jobData);
            document.getElementById('order-id').value = '';
            document.getElementById('order-qty').value = '';
            alert("บันทึกข้อมูลเรียบร้อย");
            window.showPage('datalist');
        };

        window.toggleStatus = async (uid, currentStatus) => {
            const next = currentStatus === 'TRUE' ? 'FALSE' : 'TRUE';
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'jobs', uid), { status: next });
        };

        window.removeItem = async (col, uid) => {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลนี้?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, uid));
            }
        };

        // --- IMPORT CSV ---
        window.importCSV = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const lines = e.target.result.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length < 2) return;

                    const header = lines[0].replace(/"/g, '');
                    let type = "";

                    // ตรวจสอบหัวไฟล์จากที่ User ส่งมา
                    if (header.includes("เวลาที่รับงาน")) type = "jobs";
                    else if (header.includes("ครั้งที่")) type = "edit_logs";
                    else if (header.includes("รหัสSKU") || header.includes("วันที่และเวลา")) type = "corrections";

                    if (!type) { alert("ไม่พบรูปแบบไฟล์ที่รองรับ"); return; }

                    let count = 0;
                    for (let i = 1; i < lines.length; i++) {
                        // แยกคอมม่าแบบฉลาด (รองรับคอมม่าในเครื่องหมายคำพูด)
                        const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                        const clean = cols.map(v => v.trim().replace(/^"|"$/g, ''));

                        let data = { createdAt: serverTimestamp() };
                        if (type === "jobs") {
                            data = { ...data, date: clean[0], time: clean[1], id: clean[2], qty: clean[3], dept: clean[4], status: 'TRUE' };
                        } else if (type === "edit_logs") {
                            data = { ...data, date: clean[0], time: clean[1], count: clean[2], qty: clean[3] };
                        } else if (type === "corrections") {
                            data = { ...data, dateTime: clean[0], img: clean[1], type: clean[2], sku: clean[3], order: clean[4] };
                        }
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', type), data);
                        count++;
                    }
                    alert(`นำเข้า [${type}] สำเร็จ ${count} รายการ`);
                } catch (err) { alert("เกิดข้อผิดพลาด: " + err.message); }
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = "";
        };

        // --- UI RENDERING ---
        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            refreshUI();
        };

        function refreshUI() {
            // Update Dashboard Counters
            const elT = document.getElementById('total-jobs');
            const elD = document.getElementById('done-jobs');
            const elEd = document.getElementById('edit-jobs');
            const elEr = document.getElementById('error-jobs');

            if (elT) elT.innerText = state.jobs.length;
            if (elD) elD.innerText = state.jobs.filter(j => j.status === 'TRUE').length;
            if (elEd) elEd.innerText = state.edit_logs.length;
            if (elEr) elEr.innerText = state.corrections.length;

            if (document.getElementById('datalist').style.display === 'block') window.renderJobTable();
            updateChart();
        }

        window.renderJobTable = () => {
            const type = document.getElementById('data-type-filter').value;
            const head = document.getElementById('table-head');
            const body = document.getElementById('job-table-body');
            let hHtml = "";
            let bHtml = "";

            if (type === 'jobs') {
                hHtml = `<tr><th class="p-4">วัน/เวลา</th><th class="p-4">ออเดอร์</th><th class="p-4">แผนก</th><th class="p-4 text-center">จัดการ</th></tr>`;
                bHtml = state.jobs.map(j => `
                    <tr class="job-row hover:bg-stone-50" data-search="${j.id}">
                        <td class="p-4 text-[10px] text-stone-400">${j.date}<br>${j.time}</td>
                        <td class="p-4 font-bold text-stone-700">${j.id} <span class="block text-[9px] text-orange-400">Qty: ${j.qty}</span></td>
                        <td class="p-4"><span class="px-2 py-0.5 bg-stone-100 rounded text-[9px]">${j.dept}</span></td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="window.toggleStatus('${j.uid}', '${j.status}')" class="px-2 py-1 rounded-full text-[9px] font-bold ${j.status==='TRUE'?'bg-green-100 text-green-600':'bg-orange-50 text-orange-500'}">${j.status==='TRUE'?'DONE':'WAIT'}</button>
                            <button onclick="window.removeItem('jobs', '${j.uid}')" class="text-stone-200 hover:text-red-400"><i data-lucide="trash-2" size="14"></i></button>
                        </td>
                    </tr>`).join('');
            } else if (type === 'edit_logs') {
                hHtml = `<tr><th class="p-4">วัน/เวลา</th><th class="p-4">แก้ครั้งที่</th><th class="p-4">จำนวน</th><th class="p-4 text-center">จัดการ</th></tr>`;
                bHtml = state.edit_logs.map(e => `
                    <tr class="job-row hover:bg-stone-50" data-search="${e.count}">
                        <td class="p-4 text-[10px] text-stone-400">${e.date} ${e.time}</td>
                        <td class="p-4">ครั้งที่ ${e.count}</td>
                        <td class="p-4 font-bold text-blue-500">${e.qty}</td>
                        <td class="p-4 text-center">
                            <button onclick="window.removeItem('edit_logs', '${e.uid}')" class="text-stone-200 hover:text-red-400"><i data-lucide="trash-2" size="14"></i></button>
                        </td>
                    </tr>`).join('');
            } else if (type === 'corrections') {
                hHtml = `<tr><th class="p-4">วัน/เวลา</th><th class="p-4">ประเภท</th><th class="p-4">ออเดอร์</th><th class="p-4 text-center">จัดการ</th></tr>`;
                bHtml = state.corrections.map(c => `
                    <tr class="job-row hover:bg-stone-50" data-search="${c.order} ${c.sku}">
                        <td class="p-4 text-[10px] text-stone-400">${c.dateTime}</td>
                        <td class="p-4 font-bold text-red-500">${c.type}</td>
                        <td class="p-4 text-[10px]">${c.order}<br><span class="text-stone-400">${c.sku}</span></td>
                        <td class="p-4 text-center">
                            <button onclick="window.removeItem('corrections', '${c.uid}')" class="text-stone-200 hover:text-red-400"><i data-lucide="trash-2" size="14"></i></button>
                        </td>
                    </tr>`).join('');
            }

            head.innerHTML = hHtml;
            body.innerHTML = bHtml;
            lucide.createIcons();
        };

        window.filterJobs = () => {
            const val = document.getElementById('job-search').value.toLowerCase();
            document.querySelectorAll('.job-row').forEach(row => {
                row.style.display = row.getAttribute('data-search').toLowerCase().includes(val) ? '' : 'none';
            });
        };

        function updateChart() {
            const ctx = document.getElementById('mainChart');
            if(!ctx) return;
            
            const data = {
                labels: ['งานหลัก', 'สำเร็จ', 'แก้ใหม่', 'ผิดพลาด'],
                datasets: [{
                    label: 'จำนวนงาน',
                    data: [state.jobs.length, state.jobs.filter(j=>j.status==='TRUE').length, state.edit_logs.length, state.corrections.length],
                    backgroundColor: ['#ffb347', '#22c55e', '#3b82f6', '#ef4444'],
                    borderRadius: 12
                }]
            };

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: data,
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { display: false } } }
                }
            });
        }
    </script>
</body>
</html>
