    <style>
        :root { --primary: #fb923c; --secondary: #38bdf8; --bg-main: #fdfcfb; --card-bg: #ffffff; --text-main: #334155; --text-sub: #94a3b8; }
        body { font-family: 'Inter', 'Sarabun', sans-serif; background-color: var(--bg-main); color: var(--text-main); transition: all 0.3s ease; }
        .soft-shadow { box-shadow: 0 10px 25px -5px rgba(251, 146, 60, 0.05), 0 8px 10px -6px rgba(56, 189, 248, 0.03); }
        .card { background: var(--card-bg); border: 1px solid #f8fafc; border-radius: 1.25rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        .nav-active { color: var(--primary); background: #fff7ed; font-weight: 600; box-shadow: inset 4px 0 0 var(--primary); }
        .filter-btn { font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 10px; color: var(--text-sub); transition: all 0.2s; }
        .filter-btn.active { color: white; background: var(--primary); box-shadow: 0 4px 12px rgba(251, 146, 60, 0.3); }
        .input-clean { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; font-size: 14px; outline: none; transition: all 0.2s; }
        .input-clean:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.1); }
        th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); padding: 14px 24px; border-bottom: 2px solid #fff7ed; }
        td { padding: 12px 24px; font-size: 14px; border-bottom: 1px solid #fdfcfb; }
        tr:hover { background: #fffbf7; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #fed7aa; border-radius: 10px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast { animation: slideIn 0.3s ease-out forwards; }
        @keyframes viewEntrance { 0% { transform: translateX(30px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        .view-animate { animation: viewEntrance 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .datepicker-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .datepicker-wrapper:hover { background: #fff7ed; }
        .datepicker-wrapper input[type="date"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        .datepicker-wrapper svg { position: relative; z-index: 1; color: #fb923c; }
        .check-all-box { width: 16px; height: 16px; accent-color: #fb923c; cursor: pointer; }
        /* Badge for Realtime/Static Status */
        .status-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: bold; }
        .status-live { background-color: #dcfce7; color: #166534; }
        .status-static { background-color: #f1f5f9; color: #64748b; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div id="alert-modal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">

            <button onclick="document.getElementById('alert-modal').classList.add('hidden')" class="w-full py-3 bg-orange-500 text-white font-bold rounded-xl shadow-lg shadow-orange-100 hover:scale-[1.02] active:scale-[0.98] transition-transform">ตกลง เข้าใจแล้ว</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, query, onSnapshot, serverTimestamp, getDocs, where, orderBy, limit, enableIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';        
        
        const firebaseConfig = {
            apiKey: "AIzaSyA0QWdvnA4ubJ42OAHxnDDJQUHkIFasu3w",
            authDomain: "data-5c343.firebaseapp.com",
            projectId: "data-5c343",
            storageBucket: "data-5c343.firebasestorage.app",
            messagingSenderId: "555799172632",
            appId: "1:555799172632:web:ced0d5f789362a9228156d",
            measurementId: "G-S132TKE0NB"
        };
        
        let renderTimer;
        const dateCache = new Map();
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        // --- Persistence for cost saving (re-fetch without server cost) ---
        try {
            enableIndexedDbPersistence(db).catch((err) => {
                if (err.code == 'failed-precondition') console.log('Persistence failed: Multiple tabs open');
                else if (err.code == 'unimplemented') console.log('Persistence not supported');
            });
        } catch(e) { console.log("Persistence init error", e); }

        let rawData = { orders: [], fix: [], redo: [], problems: [] };
        let activeListeners = []; 
        
        let currentView = 'overview';
        let currentTimeFilter = 'daily'; 
        let customDateValue = null;
        let currentPage = 1;
        const itemsPerPage = 50; 
        let charts = {};
        let editingRealIdx = -1;
        let user = null;
        let selectedRowKeys = new Set();
        let stickyValues = { orders: { dept: 'งานเรียง', color: 'สีแดง' }, fix: { type: 'ผิดลาย' }, redo: {}, problems: { issue: 'ปัญหากันคน' } };

        const CONFIG = {
            overview: { title: "สรุปผลการทำงาน", desc: "ภาพรวมข้อมูลการผลิตและประสิทธิภาพรายแผนก" },
            orders: { title: "บันทึกงานผลิต", desc: "จัดการรายการผลิตประจำวัน", cols: ['วันที่', 'เวลา', 'เลขที่งาน', 'จำนวน', 'แผนก', 'สีงาน', 'สถานะ'], fields: [{ name: 'date', label: 'วันที่', type: 'date' }, { name: 'time', label: 'เวลา', type: 'time' }, { name: 'id', label: 'เลขที่งาน', type: 'number' }, { name: 'count', label: 'จำนวน', type: 'number' }, { name: 'dept', label: 'แผนก', type: 'select', options: ['งานเรียง', 'งานล็อต', 'งานBY', 'งานเฉินผิง', 'งานด่วน'] }, { name: 'color', label: 'สีงาน', type: 'select', options: ['สีแดง', 'สีเหลือง', 'สีชมพู', 'สีเขียว', 'สีส้ม', 'สีฟ้า', 'สีม่วง', 'สีขาว'] }] },
            fix: { title: "รายการงานแก้", desc: "ติดตามรายการที่ต้องแก้ไข", cols: ['วันที่และเวลา', 'รูปที่', 'ประเภท', 'รหัสSKU', 'รหัสออเดอร์', 'สถานะ'], fields: [{ name: 'datetime', label: 'วันที่และเวลา', type: 'datetime-local' }, { name: 'photo_no', label: 'รูปที่', type: 'number' }, { name: 'type', label: 'ประเภท', type: 'select', options: ['ผิดลาย', 'ผิดสี', 'ผิดตำแหน่ง', 'ผิดขนาด', 'อื่น'] }, { name: 'sku', label: 'รหัสSKU', type: 'text' }, { name: 'orderid', label: 'รหัสออเดอร์', type: 'text' }] },
            redo: { title: "บันทึกงานเสีย", desc: "จัดเก็บข้อมูลงานที่ต้องทำใหม่", cols: ['วันที่', 'เวลา', 'ครั้งที่', 'จำนวน', 'สถานะ'], fields: [{ name: 'date', label: 'วันที่', type: 'date' }, { name: 'time', label: 'เวลา', type: 'time' }, { name: 'attempt', label: 'ทำใหม่ครั้งที่', type: 'number' }, { name: 'count', label: 'จำนวนเสีย', type: 'number' }] },
            problems: { title: "บันทึกปัญหา", desc: "เก็บบันทึกอุปสรรคและปัญหาในการทำงาน", cols: ['วันที่', 'เวลา', 'หัวข้อปัญหา', 'รายละเอียด', 'สถานะ'], fields: [{ name: 'date', label: 'วันที่', type: 'date' }, { name: 'time', label: 'เวลา', type: 'time' }, { name: 'issue', label: 'หัวข้อปัญหา', type: 'select', options: ['ปัญหาบุคคล', 'ปัญหางาน'] }, { name: 'detail', label: 'รายละเอียด', type: 'text' }] }
        };
        const themeColors = { orange: '#fb923c', blue: '#38bdf8', indigo: '#818cf8', amber: '#fbbf24', rose: '#fb7185', teal: '#2dd4bf', slate: '#94a3b8' };

        async function initAuth() { try { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } else { await signInAnonymously(auth); } } catch (error) { await signInAnonymously(auth); } }
        onAuthStateChanged(auth, (u) => { user = u; if (u) { document.getElementById('user-display').innerText = `ID ผู้ใช้งาน: ${u.uid.substring(0,6)}...`; syncData(); } });

        // --- UPDATED HYBRID SYNC (Economy + Realtime) ---
        function syncData() {
            if (!user) return;
            
            // Cleanup old listeners
            activeListeners.forEach(unsub => unsub());
            activeListeners = [];
            rawData = { orders: [], fix: [], redo: [], problems: [] }; 

            const collections = ['orders', 'fix', 'redo', 'problems'];
            const { start, end } = getDateRange();
            const statusIndicator = document.getElementById('data-status-indicator');

            // Logic: If 'All', use getDocs (One-time fetch to save reads). 
            // If Daily/Monthly, use onSnapshot (Real-time).
            const isStaticMode = currentTimeFilter === 'all' || currentTimeFilter === 'monthly';
            
            if (isStaticMode) {
                statusIndicator.innerText = "Offline/Static";
                statusIndicator.className = "status-badge status-static";
                statusIndicator.classList.remove('hidden');
            } else {
                statusIndicator.innerText = "Real-time";
                statusIndicator.className = "status-badge status-live";
                statusIndicator.classList.remove('hidden');
            }

            collections.forEach(col => {
                let constraints = [orderBy('timestamp', 'desc')];
                
                if (!isStaticMode && start && end) {
                    constraints.push(where('timestamp', '>=', start));
                    constraints.push(where('timestamp', '<=', end));
                }

                const qCol = query(collection(db, 'artifacts', appId, 'public', 'data', col), ...constraints);

                if (isStaticMode) {
                    // ONE-TIME FETCH for 'All' to save costs and prevent loops
                    getDocs(qCol).then((snapshot) => {
                        const newData = snapshot.docs.map(doc => ({ firebaseId: doc.id, data: doc.data().data }));
                        rawData[col] = newData;
                        triggerRender();
                    }).catch(err => {
                        console.error("Fetch error:", err);
                        showToast("โหลดข้อมูลล้มเหลว", "error");
                    });
                } else {
                    // REAL-TIME for Daily/Monthly
                    const unsub = onSnapshot(qCol, (snapshot) => {
                        // Metadata.fromCache check if needed, but persistence handles it silently
                        const newData = snapshot.docs.map(doc => ({ firebaseId: doc.id, data: doc.data().data }));
                        rawData[col] = newData;
                        triggerRender();
                    }, (error) => {
                        console.error("Sync error:", error);
                    });
                    activeListeners.push(unsub);
                }
            });
        }

        function triggerRender() {
            clearTimeout(renderTimer);
            renderTimer = setTimeout(() => {
                if (currentView === 'overview') {
                    refreshOverview();
                } else {
                    renderTable();
                    updateStats();
                }
            }, 150);
        }

        function getDateRange() {
            const now = new Date();
            let start, end;
            if (currentTimeFilter === 'daily') {
                start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
            } else if (currentTimeFilter === 'monthly') {
                start = new Date(now.getFullYear(), now.getMonth(), 1);
                end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
            } else if (currentTimeFilter === 'custom' && customDateValue) {
                const parts = customDateValue.split('-');
                start = new Date(parts[0], parts[1]-1, parts[2]);
                end = new Date(parts[0], parts[1]-1, parts[2], 23, 59, 59, 999);
            } else {
                return { start: null, end: null }; 
            }
            return { start, end };
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (!user) return;
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'กำลังบันทึก...';
            try {
                const inputs = Array.from(e.target.querySelectorAll('input, select')).filter(i => i.name);
                const formData = inputs.map(input => {
                    stickyValues[currentView][input.name] = input.value; 
                    if ((input.type === 'date' || input.type === 'datetime-local') && input.value) {
                        const [datePart, timePart] = input.value.split('T');
                        const [y, m, d] = datePart.split('-');
                        const bYear = parseInt(y) + 543;
                        return timePart ? `${d}/${m}/${bYear} ${timePart}` : `${d}/${m}/${bYear}`;
                    }
                    if (input.type === 'time' && input.value) {
                        return input.value; 
                    }
                    return input.value.trim();
                });
                if (formData.some(v => v === "")) throw new Error("กรุณากรอกข้อมูลให้ครบ");
                formData.push("รอดำเนินการ");
                if (editingRealIdx > -1) {
                    const rowObj = rawData[currentView][editingRealIdx];
                    if(rowObj) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentView, rowObj.firebaseId), { data: formData, timestamp: serverTimestamp() });
                        // If in 'all' mode (static), manually update local data to reflect change immediately
                        if (currentTimeFilter === 'all') {
                             rowObj.data = formData;
                             triggerRender();
                        }
                    }
                    editingRealIdx = -1;
                } else {
                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', currentView), { data: formData, timestamp: serverTimestamp() });
                    // If in 'all' mode (static), manually append to local data
                    if (currentTimeFilter === 'all') {
                        rawData[currentView].unshift({ firebaseId: docRef.id, data: formData });
                        triggerRender();
                    }
                }
                showToast("บันทึกสำเร็จ"); 
                renderForm(currentView); 
            } catch (err) { showAlert("ผิดพลาด", err.message); } finally { btn.disabled = false; btn.innerHTML = originalText; }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-orange-500' : type === 'info' ? 'bg-sky-500' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            toast.className = `toast ${bg} text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3 font-bold text-sm min-w-[200px] border border-white/20 backdrop-blur-md`;
            toast.innerHTML = `<div class="w-2 h-2 rounded-full bg-white animate-ping"></div><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
        }
        function speak(text) { if ('speechSynthesis' in window) { const msg = new SpeechSynthesisUtterance(text); msg.lang = 'th-TH'; msg.rate = 1.1; window.speechSynthesis.speak(msg); } }
        function showAlert(title, msg) { document.getElementById('alert-title').innerText = title; document.getElementById('alert-msg').innerText = msg; document.getElementById('alert-modal').classList.remove('hidden'); speak(msg); }      
        
        function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            const str = dateStr.toString().replace(/"/g, '').trim();
            if (dateCache.has(str)) return dateCache.get(str);
            const parts = str.split(' ');
            const dPart = parts[0];
            const tPart = parts[1] || "00:00";
            const p = dPart.split('/');
            if (p.length < 3) return new Date(0);
            let y = parseInt(p[2]); if (y > 2400) y -= 543;
            const [h, min] = tPart.split(':');
            const d = new Date(y, parseInt(p[1]) - 1, parseInt(p[0]), parseInt(h) || 0, parseInt(min) || 0);
            dateCache.set(str, d); return d;
        }

        async function toggleStatus(view, globalIdx) {
            if (!user) return;
            const rowObj = rawData[view][globalIdx];
            if (!rowObj) return;
            const newData = [...rowObj.data];
            const statusIdx = newData.length - 1;
            newData[statusIdx] = (newData[statusIdx] === 'เสร็จแล้ว' || newData[statusIdx] === 'TRUE') ? 'กำลังทำ' : 'เสร็จแล้ว';
            try { 
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', view, rowObj.firebaseId), { data: newData });

        }

        async function deleteRow(v, globalIdx) {
            if (!user) return;
            const rowObj = rawData[v][globalIdx];
            if(!rowObj || !confirm("ลบรายการนี้?")) return;
            try { 
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', v, rowObj.firebaseId)); 
                if (currentTimeFilter === 'all') { rawData[v].splice(globalIdx, 1); triggerRender(); }

        }

        function toggleRowSelection(escapedJson) {
            const rowJson = escapedJson.replace(/&quot;/g, '"');
            if (selectedRowKeys.has(rowJson)) { selectedRowKeys.delete(rowJson); } else { selectedRowKeys.add(rowJson); }
            updateBulkDeleteUI(); renderTable();
        }

        function toggleAllSelection(isChecked) {
            const allInView = rawData[currentView];
            const start = (currentPage - 1) * itemsPerPage;
            const displayData = allInView.slice(start, start + itemsPerPage);
            displayData.forEach(rowObj => { const key = JSON.stringify(rowObj.data); if (isChecked) selectedRowKeys.add(key); else selectedRowKeys.delete(key); });

        function updateBulkDeleteUI() {
            const btn = document.getElementById('bulk-delete-btn');
            const count = selectedRowKeys.size;
            if (count > 0) { btn.innerText = `ลบที่เลือก (${count})`; btn.classList.remove('hidden'); } else { btn.classList.add('hidden'); }

        async function deleteSelectedRows() {
            if (!user || selectedRowKeys.size === 0) return;
            if (!confirm(`ยืนยันการลบทั้งหมด ${selectedRowKeys.size} รายการ?`)) return;         
            const allInView = rawData[currentView];
            const keysToDelete = Array.from(selectedRowKeys);
            for (const rowJson of keysToDelete) {
                const targetObj = allInView.find(o => JSON.stringify(o.data) === rowJson);
                if (targetObj) { 
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', currentView, targetObj.firebaseId)); 
                    if (currentTimeFilter === 'all') { const idx = rawData[currentView].indexOf(targetObj); if(idx>-1) rawData[currentView].splice(idx,1); }

            selectedRowKeys.clear(); updateBulkDeleteUI(); showToast(`ลบสำเร็จแล้ว`);

            charts.ovFixTypePie = new Chart(document.getElementById('ovFixTypePieChart'), { type: 'doughnut', data: { labels: Object.keys(fixTypeMap), datasets: [{ data: Object.values(fixTypeMap), backgroundColor: [themeColors.orange, themeColors.blue, themeColors.indigo, themeColors.rose, themeColors.amber, themeColors.teal], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%' } });
            const pOrders = orders.filter(o => (o.data[o.data.length-1] !== 'เสร็จแล้ว' && o.data[o.data.length-1] !== 'TRUE')).map(o => ({ t: 'งานผลิต', id: o.data[2], d: o.data[0], h: o.data[1], c: 'text-orange-400', fbId: o.firebaseId, view: 'orders', data: o.data }));
            const pFix = fix.filter(f => (f.data[f.data.length-1] !== 'เสร็จแล้ว' && f.data[f.data.length-1] !== 'TRUE')).map(f => ({ t: 'งานแก้', id: f.data[4]||f.data[3], d: f.data[0], h: '', c: 'text-indigo-400', fbId: f.firebaseId, view: 'fix', data: f.data }));
            const allPending = [...pOrders, ...pFix].sort((a,b) => parseDate(b.d, b.h) - parseDate(a.d, a.h)).slice(0, 10);
            document.getElementById('ovRecentList').innerHTML = allPending.map(i => `<div class="px-8 py-4 flex justify-between items-center bg-white hover:bg-orange-50/20"><div><span class="text-[9px] font-black ${i.c} uppercase">${i.t} #${i.id}</span><p class="text-[10px] text-slate-300 font-bold">${i.d.toString().replace(/"/g,'')}</p></div><button onclick="directToggleStatus('${i.view}', '${i.fbId}', ${JSON.stringify(i.data).replace(/"/g, '&quot;')})" class="px-3 py-1 bg-orange-50 text-orange-500 text-[9px] font-black rounded-lg">กำลังทำ</button></div>`).join('') || '<div class="py-16 text-center text-slate-200">ไม่มีงานค้าง</div>';
        }

        async function directToggleStatus(view, fbId, currentData) {
            if (!user) return;
            const newData = [...currentData];
            const statusIdx = newData.length - 1;
            newData[statusIdx] = (newData[statusIdx] === 'เสร็จแล้ว' || newData[statusIdx] === 'TRUE') ? 'กำลังทำ' : 'เสร็จแล้ว';
            try { 
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', view, fbId), { data: newData }); 
                if (currentTimeFilter === 'all') { // Manually update UI for static mode
                    const target = rawData[view].find(x => x.firebaseId === fbId);
                    if (target) { target.data = newData; triggerRender(); }
                }
                showToast("อัปเดตสถานะแล้ว"); 
            } catch (err) { console.error("Sync error:", err); }
        }

        function filterTableSearch() { const q = document.getElementById('search').value.toLowerCase(); document.querySelectorAll('#table-body tr').forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none'); }
        
        async function handleFiles(e) {
            if (!user) return;
            const files = Array.from(e.target.files);
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const lines = ev.target.result.split('\n').filter(l => l.trim());
                    if (lines.length <= 1) return;
                    const header = lines[0].toLowerCase();
                    const rawRows = lines.slice(1).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
                    let targetCol = header.includes('แผนก') ? "orders" : header.includes('sku') ? "fix" : header.includes('ครั้งที่') ? "redo" : "";
                    if (targetCol) {
                        for (const row of rawRows) {
                            if(row.length > 1) {
                                let finalRow = [...row];
                                if (targetCol === "fix" && row.length >= 2) finalRow = [`${row[0]} ${row[1]}`, ...row.slice(2)];
                                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', targetCol), { data: finalRow, timestamp: serverTimestamp() });
                            }
                        }
                        showToast(`นำเข้า ${targetCol} สำเร็จ`);
                    }
                };
                reader.readAsText(file);
            }
        }

        function exportAllData() {
            let csv = "\ufeffType,Data\n";
            Object.keys(rawData).forEach(k => { rawData[k].forEach(r => csv += `${k.toUpperCase()},${r.data.join(',')}\n`); });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "Report_All.csv"; link.click();
        }

        window.onload = async () => { await initAuth(); switchView('overview'); };
        window.setTimeFilter = setTimeFilter; window.switchView = switchView; window.handleFormSubmit = handleFormSubmit; window.toggleStatus = toggleStatus; window.directToggleStatus = directToggleStatus; window.syncData = syncData; window.deleteRow = deleteRow; window.editRow = editRow; window.cancelEdit = cancelEdit; window.changePage = changePage; window.filterTableSearch = filterTableSearch; window.handleFiles = handleFiles; window.exportAllData = exportAllData; window.toggleRowSelection = toggleRowSelection; window.toggleAllSelection = toggleAllSelection; window.deleteSelectedRows = deleteSelectedRows;
    </script>
</body>
</html>
